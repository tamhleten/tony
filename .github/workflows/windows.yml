name: Windows CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:

    runs-on: windows-2022

    steps:

    - uses: actions/checkout@v4

    - uses: ProjectSavanna/setup-sml@v1.2.0
      with:
        smlnj-version: '110.99.4'

    - uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - uses: jurplel/install-qt-action@v3
      with:
        version: '6.6.1'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2019_64'

    - name: Install Boost headers
      shell: pwsh
      run: |
        $zip = "$env:RUNNER_TEMP\boost_1_84_0.zip"
        $dest = "$env:GITHUB_WORKSPACE\boost-local"

        Invoke-WebRequest `
          "https://archives.boost.io/release/1.84.0/source/boost_1_84_0.zip" `
          -OutFile $zip

        Expand-Archive `
          -Path $zip `
          -DestinationPath $dest

        $root = "$dest\boost_1_84_0"

        if (!(Test-Path "$root\boost\version.hpp")) {
            throw "Boost extraction failed"
        }

    - uses: ilammy/msvc-dev-cmd@v1
      with:
        vsversion: '2022'

    - name: install-meson
      run: pip install meson ninja

    - name: repoint
      run: ./repoint install

    - name: Patch Meson Boost dependency
      shell: pwsh
      run: |
        $path = "meson.build"
        $text = [IO.File]::ReadAllText($path)

        $old = "boost_dep = dependency('boost')"
        $new = "boost_dep = declare_dependency(include_directories: include_directories('boost-local/boost_1_84_0'))"

        $count = ([regex]::Matches(
            $text,
            [regex]::Escape($old)
        )).Count

        if ($count -ne 1) {
            throw "Expected exactly one Boost dependency line, found $count"
        }

        $text = $text.Replace($old, $new)

        [IO.File]::WriteAllText($path, $text)

    - name: Patch display for E-flat baritone sax
      shell: pwsh
      run: |

        function Replace-One($path, $pattern, $replacement, $label) {

            $text = [IO.File]::ReadAllText($path)
            $rx = [regex]::new($pattern)

            $count = $rx.Matches($text).Count

            if ($count -ne 1) {
                throw "$label : expected exactly one match in $path, found $count"
            }

            $text = $rx.Replace(
                $text,
                $replacement,
                1
            )

            [IO.File]::WriteAllText(
                $path,
                $text
            )

            Write-Host "$label applied successfully."
        }


        # ============================================================
        # BARITONE SAX DISPLAY
        #
        # Concert/sounding -> written Eb bari = +21 semitones.
        #
        # Preferred spelling:
        #
        # C C# D D# E F F# G G# A Bb B
        #
        # The underlying pYIN pitch values are NOT changed.
        # ============================================================


        # ------------------------------------------------------------
        # 1. Pitch-track hover
        # ------------------------------------------------------------

        $timePattern = 'valueText = tr\("%1 Hz \(%2, %3\)"\)\s*\.arg\(value\)\s*\.arg\(Pitch::getPitchLabelForFrequency\(value\)\)\s*\.arg\(Pitch::getPitchForFrequency\(value\)\);'

        $timeReplacement = @"
        const double bariValue =
                    value * 3.363585661014858;

                valueText = tr("%1 (Bari)")
                    .arg(
                        Pitch::getPitchLabelForFrequency(
                            bariValue
                        )
                    );
        "@

        Replace-One `
            "svgui/layer/TimeValueLayer.cpp" `
            $timePattern `
            $timeReplacement `
            "Pitch-track hover"


        # ------------------------------------------------------------
        # 2. Note hover
        # ------------------------------------------------------------

        $notePattern = 'pitchText = tr\("%1 Hz \(%2, %3\)"\)\s*\.arg\(note\.getValue\(\)\)\s*\.arg\(Pitch::getPitchLabelForFrequency\(note\.getValue\(\)\)\)\s*\.arg\(Pitch::getPitchForFrequency\(note\.getValue\(\)\)\);'

        $noteReplacement = @"
        const double bariValue =
                    note.getValue() * 3.363585661014858;

                pitchText = tr("%1 (Bari)")
                    .arg(
                        Pitch::getPitchLabelForFrequency(
                            bariValue
                        )
                    );
        "@

        Replace-One `
            "svgui/layer/FlexiNoteLayer.cpp" `
            $notePattern `
            $noteReplacement `
            "Note hover"


        # ------------------------------------------------------------
        # 3. Constructor:
        #    FlexiNote MUST start with its own logarithmic scale.
        # ------------------------------------------------------------

        $defaultsPattern = 'm_verticalScale\(AutoAlignScale\),\s*m_editMode\(DragNote\),\s*m_scaleMinimum\(34\),\s*m_scaleMaximum\(77\)'

        $defaultsReplacement = @"
        m_verticalScale(LogScale),
            m_editMode(DragNote),
            m_scaleMinimum(0),
            m_scaleMaximum(0)
        "@

        Replace-One `
            "svgui/layer/FlexiNoteLayer.cpp" `
            $defaultsPattern `
            $defaultsReplacement `
            "FlexiNote LogScale constructor"


        # ------------------------------------------------------------
        # 4. IMPORTANT:
        #
        # Tony can restore verticalScale=0 (Auto-Align) from saved
        # layer/session properties AFTER construction.
        #
        # For this custom bari build we never allow FlexiNote to
        # return to AutoAlignScale. AutoAlign requests become LogScale.
        # ------------------------------------------------------------

        $setScalePattern = '(?s)void\s+FlexiNoteLayer::setVerticalScale\(VerticalScale scale\)\s*\{\s*if \(m_verticalScale == scale\) return;\s*m_verticalScale = scale;\s*emit layerParametersChanged\(\);\s*\}'

        $setScaleReplacement = @"
        void
        FlexiNoteLayer::setVerticalScale(VerticalScale scale)
        {
            // Tony normally permits AutoAlignScale.
            // In the bari build the note layer must always own
            // a real pitch coordinate scale.

            if (scale == AutoAlignScale) {
                scale = LogScale;
            }

            if (m_verticalScale == scale) return;

            m_verticalScale = scale;
            emit layerParametersChanged();
        }
        "@

        Replace-One `
            "svgui/layer/FlexiNoteLayer.cpp" `
            $setScalePattern `
            $setScaleReplacement `
            "Prevent FlexiNote Auto-Align"


        # ------------------------------------------------------------
        # 5. Also change the declared default property from
        #    Auto-Align to Log.
        # ------------------------------------------------------------

        $propertyDefaultPattern = 'if \(deflt\) \*deflt = int\(AutoAlignScale\);'

        $propertyDefaultReplacement = @"
        if (deflt) *deflt = int(LogScale);
        "@

        Replace-One `
            "svgui/layer/FlexiNoteLayer.cpp" `
            $propertyDefaultPattern `
            $propertyDefaultReplacement `
            "LogScale property default"


        # ------------------------------------------------------------
        # 6. Selected-note text:
        #
        # freq: 69.3Hz
        #
        # -> note: Bb3 (Bari)
        # ------------------------------------------------------------

        $selectedPattern = 'QString vlabel = tr\("freq: %1%2"\)\s*\.arg\(p\.getValue\(\)\)\.arg\(model->getScaleUnits\(\)\);'

        $selectedReplacement = @"
        QString vlabel;

                    if (model->getScaleUnits() == "Hz") {

                        const double bariValue =
                            p.getValue() *
                            3.363585661014858;

                        const int bariMidi =
                            Pitch::getPitchForFrequency(
                                bariValue
                            );

                        static const char *bariNames[12] = {
                            "C",
                            "C#",
                            "D",
                            "D#",
                            "E",
                            "F",
                            "F#",
                            "G",
                            "G#",
                            "A",
                            "Bb",
                            "B"
                        };

                        vlabel =
                            tr("note: %1%2 (Bari)")
                            .arg(
                                QString::fromLatin1(
                                    bariNames[
                                        bariMidi % 12
                                    ]
                                )
                            )
                            .arg(
                                bariMidi / 12 - 1
                            );

                    } else {

                        vlabel =
                            tr("freq: %1%2")
                            .arg(p.getValue())
                            .arg(model->getScaleUnits());
                    }
        "@

        Replace-One `
            "svgui/layer/FlexiNoteLayer.cpp" `
            $selectedPattern `
            $selectedReplacement `
            "Selected-note label"


        # ------------------------------------------------------------
        # 7. BARI Y AXIS
        #
        # Coordinates remain sounding Hz.
        #
        # Labels become:
        #
        # Bb3
        # B3
        # C4
        # C#4
        # D4
        # D#4
        # E4
        # ...
        # ------------------------------------------------------------

        $axisPattern = '(?s)void\s+FlexiNoteLayer::paintVerticalScale\(LayerGeometryProvider \*v, bool, QPainter &paint, QRect\) const\s*\{.*?\}\s*void\s+FlexiNoteLayer::drawStart'

        $axisReplacement = @"
        void
        FlexiNoteLayer::paintVerticalScale(
            LayerGeometryProvider *v,
            bool,
            QPainter &paint,
            QRect
        ) const
        {
            auto model =
                ModelById::getAs<NoteModel>(m_model);

            if (!model || model->isEmpty()) {
                return;
            }

            CoordinateScale scale =
                getVerticalExtents().second;

            int w =
                getVerticalScaleWidth(
                    v,
                    false,
                    paint
                );

            int h =
                v->getPaintHeight();


            static const char *noteNames[12] = {
                "C",
                "C#",
                "D",
                "D#",
                "E",
                "F",
                "F#",
                "G",
                "G#",
                "A",
                "Bb",
                "B"
            };


            if (scale.getUnit() == "Hz") {

                int lastLabelY = -10000;


                for (
                    int soundingMidi = 0;
                    soundingMidi <= 106;
                    ++soundingMidi
                ) {

                    // Eb baritone written pitch
                    // is 21 semitones above sounding pitch.

                    const int writtenMidi =
                        soundingMidi + 21;

                    const double frequency =
                        Pitch::getFrequencyForPitch(
                            soundingMidi
                        );

                    const int y =
                        scale.getCoordForValueRounded(
                            v,
                            frequency
                        );


                    if (
                        y < 0 ||
                        y > h
                    ) {
                        continue;
                    }


                    // Prevent labels overlapping visually.

                    if (
                        lastLabelY != -10000 &&
                        std::abs(
                            y - lastLabelY
                        ) <
                        paint.fontMetrics().height()
                    ) {
                        continue;
                    }


                    QString label =
                        QString("%1%2")
                        .arg(
                            QString::fromLatin1(
                                noteNames[
                                    writtenMidi % 12
                                ]
                            )
                        )
                        .arg(
                            writtenMidi / 12 - 1
                        );


                    paint.drawText(
                        2,
                        y +
                        paint.fontMetrics().ascent() / 2,
                        label
                    );


                    paint.drawLine(
                        w - 5,
                        y,
                        w,
                        y
                    );


                    lastLabelY = y;
                }


                paint.drawLine(
                    w,
                    0,
                    w,
                    h
                );


            } else {

                if (scale.isLogarithmic()) {

                    LogNumericalScale()
                        .paintVertical(
                            v,
                            scale,
                            paint,
                            0
                        );

                } else {

                    LinearNumericalScale()
                        .paintVertical(
                            v,
                            scale,
                            paint,
                            0
                        );
                }
            }
        }


        void
        FlexiNoteLayer::drawStart
        "@

        Replace-One `
            "svgui/layer/FlexiNoteLayer.cpp" `
            $axisPattern `
            $axisReplacement `
            "Bari note Y-axis"


        # ------------------------------------------------------------
        # 8. Give enough width for labels such as "Bb3" / "C#4".
        #
        # Also guarantees FlexiNote advertises a non-zero scale width.
        # ------------------------------------------------------------

        $widthPattern = '(?s)int\s+FlexiNoteLayer::getVerticalScaleWidth\(LayerGeometryProvider \*v, bool, QPainter &paint\) const\s*\{.*?\}\s*void\s+FlexiNoteLayer::paintVerticalScale'

        $widthReplacement = @"
        int
        FlexiNoteLayer::getVerticalScaleWidth(
            LayerGeometryProvider *,
            bool,
            QPainter &paint
        ) const
        {
            return paint.fontMetrics().horizontalAdvance("Bb10") + 12;
        }

        void
        FlexiNoteLayer::paintVerticalScale
        "@

        Replace-One `
            "svgui/layer/FlexiNoteLayer.cpp" `
            $widthPattern `
            $widthReplacement `
            "Bari Y-axis width"


        # ------------------------------------------------------------
        # 9. PANE:
        #
        # Explicitly prefer a visible FlexiNoteLayer for the pane's
        # left-hand scale instead of WaveformLayer.
        # ------------------------------------------------------------

        $panePattern = 'm_scaleWidth = 0;\s*if \(m_manager && m_manager->shouldShowVerticalScale\(\) && topLayer\) \{\s*drawVerticalScale\(r, topLayer, paint\);\s*\}'

        $paneReplacement = @"
        m_scaleWidth = 0;

            if (
                m_manager &&
                m_manager->shouldShowVerticalScale() &&
                topLayer
            ) {

                Layer *verticalScaleLayer =
                    topLayer;

                for (
                    auto i = m_layerStack.rbegin();
                    i != m_layerStack.rend();
                    ++i
                ) {

                    Layer *candidate =
                        *i;

                    if (
                        candidate->isLayerDormant(this)
                    ) {
                        continue;
                    }

                    if (
                        dynamic_cast<FlexiNoteLayer *>(
                            candidate
                        ) != nullptr
                    ) {

                        verticalScaleLayer =
                            candidate;

                        break;
                    }
                }

                drawVerticalScale(
                    r,
                    verticalScaleLayer,
                    paint
                );
            }
        "@

        Replace-One `
            "svgui/view/Pane.cpp" `
            $panePattern `
            $paneReplacement `
            "Prefer FlexiNote pane Y-axis"


        Write-Host ""
        Write-Host "======================================"
        Write-Host "All bari display patches applied."
        Write-Host "FlexiNote Auto-Align is disabled."
        Write-Host "Pane prefers FlexiNote pitch scale."
        Write-Host "======================================"


    - name: configure
      run: meson setup build --buildtype release

    - name: copy-qt-etc
      run: |
          foreach ($lib in 'Core','Gui','Widgets','Network','Xml','Svg','Test') {
              copy "..\Qt\6.6.1\msvc2019_64\bin\Qt6$lib.dll" build
          }

          cp sv-dependency-builds\win64-msvc\lib\libsndfile-1.dll build

    - name: build
      run: ninja -C build

    - name: Deploy Qt runtime
      shell: pwsh
      run: |
        $windeployqt =
            "..\Qt\6.6.1\msvc2019_64\bin\windeployqt.exe"

        if (!(Test-Path $windeployqt)) {
            throw "windeployqt.exe not found at $windeployqt"
        }

        if (!(Test-Path "build\tony.exe")) {
            throw "Tony executable not found"
        }

        & $windeployqt `
          --release `
          --compiler-runtime `
          --no-translations `
          "build\tony.exe"

        if ($LASTEXITCODE -ne 0) {
            throw "windeployqt failed with exit code $LASTEXITCODE"
        }

        if (!(Test-Path "build\platforms\qwindows.dll")) {
            throw "qwindows.dll was not deployed"
        }

    - name: Upload Tony Bari
      uses: actions/upload-artifact@v4
      with:
        name: Tony-Bari-Windows
        path: build/
        retention-days: 7

    - name: test
      run: meson test -C build
